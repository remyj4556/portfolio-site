<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0e0a" />
    <title>Page not found</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/jetbrains-mono-latin-700.woff2') format('woff2');
      }
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        background: #0a0e0a;
        color: #d4e4d8;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 16px;
        line-height: 1.6;
      }
      ::selection {
        background: #00ff41;
        color: #0a0e0a;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 700;
      }
      h1 span {
        color: #00ff41;
      }
      p {
        margin: 0 0 24px;
        color: #8aa394;
      }
      a {
        color: #d4e4d8;
        text-underline-offset: 3px;
      }
      a:hover {
        color: #00ff41;
      }
      a:focus-visible {
        outline: 2px solid #00ff41;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><span aria-hidden="true">&gt; </span>404</h1>
      <p>This page doesn't exist.</p>
      <a href="/">Back to the homepage</a>
    </main>
  </body>
</html>
